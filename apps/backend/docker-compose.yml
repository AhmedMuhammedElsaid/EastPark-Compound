services:
    postgres:
        image: postgres:16-alpine
        container_name: eastpark-postgres
        restart: unless-stopped
        ports:
            - '5432:5432'
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-postgres}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
            POSTGRES_DB: ${POSTGRES_DB:-eastpark}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - app-network
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s

    redis:
        image: redis:7-alpine
        container_name: eastpark-redis
        restart: unless-stopped
        ports:
            - '6379:6379'
        volumes:
            - redis_data:/data
        networks:
            - app-network
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        command: redis-server --appendonly yes

    mailpit:
        image: axllent/mailpit:latest
        container_name: eastpark-mailpit
        restart: unless-stopped
        ports:
            - '1025:1025' # SMTP
            - '8025:8025' # Web UI → http://localhost:8025
        networks:
            - app-network

    minio:
        image: minio/minio:latest
        container_name: eastpark-minio
        restart: unless-stopped
        ports:
            - '9002:9000' # S3 API
            - '9001:9001' # Console → http://localhost:9001
        environment:
            MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
            MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
        volumes:
            - minio_data:/data
        networks:
            - app-network
        command: server /data --console-address ":9001"
        healthcheck:
            test: ['CMD', 'mc', 'ready', 'local']
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 15s

    minio-init:
        image: minio/mc:latest
        container_name: eastpark-minio-init
        depends_on:
            minio:
                condition: service_healthy
        networks:
            - app-network
        entrypoint: >
            /bin/sh -c "
              mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD};
              mc mb --ignore-existing local/eastpark-uploads;
              mc anonymous set public local/eastpark-uploads;
              echo 'MinIO bucket ready';
            "
        restart: 'no'

networks:
    app-network:
        driver: bridge
        name: eastpark-network

volumes:
    postgres_data:
        driver: local
        name: eastpark-postgres-data
    redis_data:
        driver: local
        name: eastpark-redis-data
    minio_data:
        driver: local
        name: eastpark-minio-data
