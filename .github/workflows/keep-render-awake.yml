name: Keep Render Awake

on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-render-awake
  cancel-in-progress: true

jobs:
  ping:
    name: Ping production health
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Keep backend available
        run: >-
          curl --fail --silent --show-error
          --max-time 90
          --retry 2
          --retry-delay 5
          https://eastpark-backend.onrender.com/health