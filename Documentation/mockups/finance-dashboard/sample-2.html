<script>/* ---------- shared data + helpers ---------- */
let seed=42;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const MON={ar:['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'],en:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']};

 unapplied:[['A2-3-1','transfer',3750,2],['B1-6-3','instapay',2500,3],['C1-4-2','cash',1250,5],['E2-2-6','cheque',5000,6],['D1-5-1','instapay',1250,8]],
 credit:{count:23,total:41250},
 close:[['c1',1],['c2',0,'5'],['c3',1],['c4',0],['c5',0],['c6',1]],

};

DATA.heat=DATA.buildings.map(b=>{const w=Array.from({length:8},()=>.3+rnd()*1.4);const s=w.reduce((a,c)=>a+c,0);let v=w.map(x=>Math.round(b[2]*x/s/250)*250);v[7]+=b[2]-v.reduce((a,c)=>a+c,0);return v});
const T={
 ar:{egp:'ج.م',collected:'المحصّل هذا الشهر',billed:'المفوتر هذا الشهر',rate:'نسبة التحصيل',outstanding:'إجمالي المتأخرات',owing:'الشقق المتأخرة',fund:'رصيد صندوق الصيانة',vs:'عن الشهر الماضي',
 bvc:'المفوتر مقابل المحصّل — آخر 12 شهراً',aging:'أعمار الديون',methods:'التحصيل حسب طريقة الدفع',bybld:'المتأخرات حسب المبنى',top:'أعلى 10 شقق متأخرة',unap:'دفعات غير مطبّقة ورصيد دائن',close:'إقفال الفترة',actions:'إجراءات سريعة',
 record:'تسجيل دفعة',find:'بحث عن شقة',d30:'0–30 يوم',d60:'31–60 يوم',d90:'61–90 يوم',d90p:'+90 يوم',cash:'نقدي',transfer:'تحويل بنكي',instapay:'إنستاباي',cheque:'شيك',
 flat:'الشقة',owner:'المالك',amount:'المبلغ',days:'أيام التأخر',open:'فتح',day:'يوم',period:'الفترة',building:'المبنى',all:'كل المباني',
 c1:'مطابقة المدفوعات النقدية',c2:'تخصيص الدفعات غير المطبّقة',c3:'مراجعة الرسوم المتأخرة',c4:'مطابقة كشف البنك',c5:'إصدار كشوف الشقق',c6:'مراجعة سجل التدقيق',left:'متبقٍ',done:'تم',
 open_p:'مفتوحة',credits:'أرصدة دائنة',paymentsN:'دفعات',billedS:'المفوتر',collS:'المحصّل',ago:'منذ',days_:'أيام',
 title:'المالية',sub:'نوفمبر 2026',fl:'الدور',remind:'تذكير',pay:'دفعة',apply:'تخصيص',lang:'EN',theme:'الوضع',back:'الفهرس',

 en:{egp:'EGP',collected:'Collected this month',billed:'Billed this month',rate:'Collection rate',outstanding:'Total outstanding',owing:'Owing flats',fund:'Maintenance fund',vs:'vs last month',
 bvc:'Billed vs collected — last 12 months',aging:'Debt aging',methods:'Collections by method',bybld:'Outstanding by building',top:'Top 10 owing flats',unap:'Unapplied payments & credits',close:'Period close',actions:'Quick actions',

 c1:'Reconcile cash payments',c2:'Apply unapplied payments',c3:'Review late fees',c4:'Match bank statement',c5:'Issue flat statements',c6:'Review audit log',left:'left',done:'Done',
 open_p:'OPEN',credits:'Credit balances',paymentsN:'payments',billedS:'Billed',collS:'Collected',ago:'',days_:'days ago',

 flats:'flats',of:'of',late:'Late',fundDep:'Fund deposit',payRec:'Payment recorded',unapRec:'Unapplied payment',lateRec:'Late fee'}};
let LANG='ar';const t=k=>(T[LANG][k]??k);
const fmt=n=>Math.round(n).toLocaleString('en-US');
const k=n=>n>=1e6?(n/1e6).toFixed(2).replace(/\.?0+$/,'')+'M':Math.round(n/1000)+'k';

const sum=a=>a.reduce((x,y)=>x+y,0);
/* ---------- chart registry ---------- */
const CH=[];let chn=0;
function chart(fn,minH){const id='ch'+(chn++);CH.push([id,fn]);return `<div class="chart" id="${id}" dir="ltr"></div>`}
function drawCharts(){CH.forEach(([id,fn])=>{const el=document.getElementById(id);if(el&&el.clientWidth)el.innerHTML=fn(el.clientWidth)})}
function tipAttr(s){return `data-tip="${s.replace(/"/g,'&quot;')}" tabindex="0"`}
/* sparkline */
function spark(vals,w=110,h=34,col='var(--c1)'){const mn=Math.min(...vals),mx=Math.max(...vals);const p=vals.map((v,i)=>[i*(w-6)/(vals.length-1)+3,h-4-(v-mn)/(mx-mn||1)*(h-10)]);const d=p.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join('');const l=p[p.length-1];return `<svg width="${w}" height="${h}" aria-hidden="true"><path d="${d}L${l[0]} ${h}L3 ${h}Z" fill="${col}" opacity=".12"/><path d="${d}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round"/><circle cx="${l[0]}" cy="${l[1]}" r="2.6" fill="${col}"/></svg>`}
/* billed vs collected bars */
function barsBvC(w,h=260,opt={}){const m={l:40,r:8,t:10,b:26},iw=w-m.l-m.r,ih=h-m.t-m.b,mx=600000;const gw=iw/12,bw=Math.max(5,Math.min(16,gw*.32));let s=`<svg width="${w}" height="${h}" role="img" aria-label="${t('bvc')}">`;
 [0,200000,400000,600000].forEach(v=>{const y=m.t+ih-v/mx*ih;s+=`<line x1="${m.l}" x2="${w-m.r}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-dasharray="${v?'3 4':''}"/><text x="${m.l-6}" y="${y+4}" text-anchor="end">${k(v)}</text>`});
 billed.forEach((b,i)=>{const c=collected[i],x=m.l+gw*i+gw/2,hb=b/mx*ih,hc=c/mx*ih;
  s+=`<rect x="${x-bw-1}" y="${m.t+ih-hb}" width="${bw}" height="${hb}" rx="3" fill="var(--c5)" opacity=".5"/><rect x="${x+1}" y="${m.t+ih-hc}" width="${bw}" height="${hc}" rx="3" fill="var(--c1)"/>`;
  s+=`<text x="${x}" y="${h-8}" text-anchor="middle">${w<520?mname(i).slice(0,LANG=='ar'?3:1):mname(i).slice(0,LANG=='ar'?5:3)}</text>`;
  s+=`<rect x="${x-gw/2}" y="${m.t}" width="${gw}" height="${ih}" fill="transparent" ${tipAttr(mname(i)+'\n'+t('billedS')+': '+fmt(b)+'\n'+t('collS')+': '+fmt(c)+'\n'+pct(c,b)+'%')}/>`});
 return s+'</svg>'}
/* donut */
function donut(items,size=170,center=''){const r=size/2-14,C=2*Math.PI*r,tot=sum(items.map(i=>i.v));let off=0;const cols=['var(--c1)','var(--c3)','var(--c2)','var(--c4)'];let s=`<svg width="${size}" height="${size}" role="img"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--elev)" stroke-width="16"/>`;
 items.forEach((it,i)=>{const len=it.v/tot*C;s+=`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${it.c||cols[i]}" stroke-width="16" stroke-dasharray="${Math.max(0,len-2)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 ${size/2} ${size/2})" ${tipAttr(it.l+'\n'+fmt(it.v)+' '+t('egp')+' ('+pct(it.v,tot)+'%)')}/>`;off+=len});
 return s+center+'</svg>'}
/* ring progress */
function ring(p,size=220,sw=18){const r=size/2-sw,C=2*Math.PI*r;return `<svg width="${size}" height="${size}" role="img" aria-label="${p}%"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--elev)" stroke-width="${sw}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--c1)" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${C*p/100} ${C}" transform="rotate(-90 ${size/2} ${size/2})"/><text x="50%" y="48%" text-anchor="middle" style="font-size:${size/4.4}px;fill:var(--tx);font-weight:300" class="n">${p}%</text><text x="50%" y="48%" dy="${size/6}" text-anchor="middle" style="font-size:12px">${t('rate')}</text></svg>`}
/* horizontal bars */
function hbar(items,w,rowH=30,col='var(--c1)',lw=44){const vw=w-lw-60,mx=Math.max(...items.map(i=>i.v));let s=`<svg width="${w}" height="${items.length*rowH}">`;items.forEach((it,i)=>{const y=i*rowH,bw=it.v/mx*vw;s+=`<text x="${lw-8}" y="${y+rowH/2+4}" text-anchor="end" style="fill:var(--tx)">${it.l}</text><rect x="${lw}" y="${y+6}" width="${vw}" height="${rowH-12}" rx="4" fill="var(--elev)"/><rect x="${lw}" y="${y+6}" width="${bw}" height="${rowH-12}" rx="4" fill="${it.c||col}" ${tipAttr(it.tip||it.l+': '+fmt(it.v))}/><text x="${lw+vw+8}" y="${y+rowH/2+4}">${k(it.v)}</text>`});return s+'</svg>'}
const agingItems=()=>[['d30','a1'],['d60','a2'],['d90','a3'],['d90p','a4']].map((a,i)=>({l:t(a[0]),v:DATA.aging[i],c:`var(--${a[1]})`}));
const methodItems=()=>DATA.methods.map((m,i)=>({l:t(m[0]),v:m[1],c:['var(--c1)','var(--c3)','var(--c2)','var(--c4)'][i]}));
const heatBg=v=>`color-mix(in srgb,var(--err) ${Math.min(80,Math.round(v/60000*100))}%,var(--elev))`;
/* ---------- shell ---------- */
function setTheme(x){document.documentElement.dataset.theme=x;try{localStorage.setItem('ep-theme',x)}catch(e){}}
function initShell(render){
 let th='dark';try{th=localStorage.getItem('ep-theme')||'dark'}catch(e){}setTheme(th);
 const tip=document.createElement('div');tip.id='tip';document.body.appendChild(tip);
 const show=(e)=>{const el=e.target.closest&&e.target.closest('[data-tip]');if(!el){tip.style.opacity=0;return}tip.textContent=el.dataset.tip;tip.style.opacity=1;const r=el.getBoundingClientRect(),x=e.clientX||r.left+r.width/2,y=e.clientY||r.top;tip.style.left=Math.max(8,Math.min(innerWidth-tip.offsetWidth-8,x-tip.offsetWidth/2))+'px';tip.style.top=Math.max(52,y-tip.offsetHeight-14)+'px'};
 document.addEventListener('mousemove',show);document.addEventListener('focusin',show);document.addEventListener('click',show);document.addEventListener('mouseleave',()=>tip.style.opacity=0);document.addEventListener('focusout',()=>tip.style.opacity=0);
 const apply=()=>{document.documentElement.lang=LANG;document.documentElement.dir=LANG=='ar'?'rtl':'ltr';CH.length=0;chn=0;render();document.getElementById('langBtn').textContent=t('lang');drawCharts()};
 document.getElementById('themeBtn').onclick=()=>setTheme(document.documentElement.dataset.theme=='dark'?'light':'dark');
 document.getElementById('langBtn').onclick=()=>{LANG=LANG=='ar'?'en':'ar';apply()};
 let lw=0;new ResizeObserver(()=>{if(innerWidth!==lw){lw=innerWidth;drawCharts()}}).observe(document.body);
 apply();
}

const S={bld:'all',per:'2026-11'};
function render(){
 const B=DATA.buildings,sel=S.bld,flt=b=>sel=='all'||sel==b;
 const top=DATA.top.filter(r=>flt(r[0].split('-')[0]));
 const outAll=sel=='all'?1284000:B.find(b=>b[0]==sel)[2];
 const kp=[['collected',fmt(441000),dlt(2.1),'var(--c1)'],['billed',fmt(512500),dlt(1.5),'var(--c5)'],['rate','86.1%',dlt(-0.9).replace('class="down','class="down'),'var(--c2)'],['outstanding',fmt(outAll),dlt(3.2).replace('class="up','class="down'),'var(--c4)'],['owing',sel=='all'?'137<small class="mut"> / 400</small>':B.find(b=>b[0]==sel)[3]+'<small class="mut"> / '+B.find(b=>b[0]==sel)[1]+'</small>',dlt(2.2).replace('class="up','class="down'),'var(--err)'],['fund',fmt(3420000),dlt(2.1),'var(--c3)']];
 document.getElementById('app').innerHTML=`
 <div class="bar"><div class="bar-in"><h1 class="serif">${t('title')}</h1>
  <label class="f"><span>${t('period')}</span><select id="per"><option value="2026-11">${LANG=='ar'?'نوفمبر 2026 · مفتوحة':'Nov 2026 · OPEN'}</option><option value="2026-10">${LANG=='ar'?'أكتوبر 2026 · مقفلة':'Oct 2026 · CLOSED'}</option><option value="2026-09">${LANG=='ar'?'سبتمبر 2026 · مقفلة':'Sep 2026 · CLOSED'}</option></select></label>
  <label class="f"><span>${t('building')}</span><select id="bld"><option value="all">${t('all')}</option>${B.map(b=>`<option ${sel==b[0]?'selected':''}>${b[0]}</option>`).join('')}</select></label>
  <span class="sp"></span><a class="btn pri sm" href="#">＋ ${t('record')}</a><a class="btn sm" href="#">🔍 ${t('find')}</a></div></div>
 <main class="wrap">
 <section class="strip">${kp.map(([l,v,d,c])=>`<div class="cell" style="--ac:${c}"><div class="kl">${t(l)}</div><div class="kv n">${v}</div><div class="kd">${d}</div></div>`).join('')}</section>
 <div class="grid">
  <section class="card p s7"><div class="ph"><h2>${LANG=='ar'?'خريطة المتأخرات — المبنى × الدور':'Arrears heat map — building × floor'}</h2><div class="legend hl"><span class="n">0</span><i class="ramp"></i><span class="n">60k+</span></div></div>
   <div class="tablewrap"><div class="heat"><div class="hr hh"><span></span>${[1,2,3,4,5,6,7,8].map(f=>`<span class="n">${t('fl')} ${f}</span>`).join('')}<span class="n">Σ</span></div>
   ${B.map((b,i)=>`<div class="hr ${flt(b[0])?'':'dim'}"><b class="n">${b[0]}</b>${DATA.heat[i].map((v,f)=>`<span class="hc n" style="background:${heatBg(v)}" ${tipAttr(b[0]+' · '+t('fl')+' '+(f+1)+'\n'+fmt(v)+' '+t('egp'))}>${k(v)}</span>`).join('')}<span class="n tot">${k(b[2])}</span></div>`).join('')}</div></div></section>
  <section class="card p s5"><div class="ph"><h2>${t('bvc')}</h2></div>${chart(w=>barsBvC(w,230))}<div class="legend"><span><i style="background:var(--c5);opacity:.6"></i>${t('billedS')}</span><span><i style="background:var(--c1)"></i>${t('collS')}</span></div></section>
  <section class="card p s7"><div class="ph"><h2>${t('top')}</h2><span class="mut n">${top.length}</span></div><div class="tablewrap"><table><thead><tr><th>${t('flat')}</th><th>${t('owner')}</th><th>${t('amount')}</th><th>${t('days')}</th><th></th></tr></thead><tbody>
   ${top.length?top.map(r=>`<tr><td><b class="n">${r[0]}</b></td><td>${r[1]}</td><td class="n">${fmt(r[2])}</td><td><span class="chip ${r[3]>120?'c4':r[3]>90?'c3':'c2'} n">${r[3]}${t('day')}</span></td><td class="acts"><button class="btn sm pri">${t('pay')}</button><button class="btn sm">${t('remind')}</button><a class="btn sm" href="#" aria-label="${t('open')}">›</a></td></tr>`).join(''):`<tr><td colspan="5" class="mut">—</td></tr>`}</tbody></table></div></section>
  <section class="card p s5"><div class="ph"><h2>${t('aging')}</h2></div>${chart(w=>hbar(agingItems().map(a=>({...a,tip:a.l+'\n'+fmt(a.v)})),w,32,'',74))}<div class="ph sub"><h2>${t('methods')}</h2></div>${chart(w=>hbar(methodItems(),w,28,'',74))}</section>
  <section class="card p s4"><div class="ph"><h2>${t('unap')}</h2><span class="chip c3 n">${DATA.unapplied.length}</span></div>
   <ul class="ls">${DATA.unapplied.map(u=>`<li><div><b class="n">${u[0]}</b><div class="mut sm2">${t(u[1])} · <span class="n">${u[3]}</span> ${t('days_')}</div></div><div class="r"><span class="n">${fmt(u[2])}</span><button class="btn sm">${t('apply')}</button></div></li>`).join('')}</ul>
   <div class="foot">${t('credits')}: <b class="n">${DATA.credit.count}</b> · <b class="n">${fmt(DATA.credit.total)}</b> ${t('egp')}</div></section>
  <section class="card p s4"><div class="ph"><h2>${t('close')}</h2><span class="chip c1">${t('open_p')}</span></div>
   <ul class="ls chk">${DATA.close.map(c=>`<li class="${c[1]?'ok':''}"><span class="bx">${c[1]?'✓':''}</span><span>${t(c[0])}</span>${c[2]?`<span class="chip c2 n">${c[2]} ${t('left')}</span>`:''}</li>`).join('')}</ul>
   <button class="btn" style="width:100%;margin-top:10px" disabled>${LANG=='ar'?'إقفال الفترة (3 بنود متبقية)':'Close period (3 items left)'}</button></section>
  <section class="card p s4"><div class="ph"><h2>${t('actions')}</h2></div><div class="qa">${[['＋',t('record')],['🔍',t('find')],['⇄',t('c4')],['📄',t('c5')],['☰',t('c6')],['⚙',LANG=='ar'?'الرسوم':'Charges']].map(a=>`<a class="btn" href="#"><span>${a[0]}</span>${a[1]}</a>`).join('')}</div></section>
 </div></main>`;
 document.getElementById('bld').onchange=e=>{S.bld=e.target.value;apply2()};
}
function apply2(){CH.length=0;chn=0;render();drawCharts()}

initShell(render);</script></body></html>
