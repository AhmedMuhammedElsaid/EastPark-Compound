services:
  - type: web
    name: eastpark-backend
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: ./apps/backend
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: APP_URL
        sync: false
      - key: WEB_APP_URL
        value: https://eastpark-web-app.vercel.app
      - key: APP_CORS_ORIGINS
        value: https://eastpark-web-app.vercel.app
      - key: APP_LOG_LEVEL
        value: info
      - key: HTTP_HOST
        value: 0.0.0.0
      - key: HTTP_PORT
        value: 10000
      - key: AUTH_ACCESS_TOKEN_EXP
        value: 15m
      - key: AUTH_REFRESH_TOKEN_EXP
        value: 7d
      - key: AUTH_ACCESS_TOKEN_SECRET
        sync: false
      - key: AUTH_REFRESH_TOKEN_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        value: EastPark <eastpark.eg@gmail.com>
      - key: EMAIL_REPLY_TO
        value: eastpark.eg@gmail.com
      - key: EMAIL_SUPPORT_TO
        value: eastpark.eg@gmail.com
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: eastpark-uploads
      - key: PAYMENTS_ENABLED
        value: false
